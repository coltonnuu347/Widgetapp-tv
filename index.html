<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="mode-dark">
  <!-- Shared gradients for the weather illustrations (js/icons.js). Kept on the page (not display:none, which breaks gradients). -->
  <svg id="wx-defs" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <radialGradient id="wxSun"><stop offset="0" stop-color="#FFF7B8"/><stop offset="0.55" stop-color="#FFD43B"/><stop offset="1" stop-color="#FF9F0A"/></radialGradient>
    <radialGradient id="wxSunGlow"><stop offset="0" stop-color="#FFD60A" stop-opacity="0.5"/><stop offset="1" stop-color="#FFD60A" stop-opacity="0"/></radialGradient>
    <linearGradient id="wxMoon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--wx-moon-hi)"/><stop offset="1" style="stop-color:var(--wx-moon-lo)"/></linearGradient>
    <radialGradient id="wxMoonGlow"><stop offset="0" style="stop-color:var(--wx-moon-hi);stop-opacity:var(--wx-glow-a)"/><stop offset="1" style="stop-color:var(--wx-moon-hi);stop-opacity:0"/></radialGradient>
    <linearGradient id="wxCloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--wx-cloud-hi)"/><stop offset="1" style="stop-color:var(--wx-cloud-lo)"/></linearGradient>
    <linearGradient id="wxCloudDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--wx-cloud-dark-hi)"/><stop offset="1" style="stop-color:var(--wx-cloud-dark-lo)"/></linearGradient>
    <linearGradient id="wxFog" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--wx-cloud-dark-lo);stop-opacity:0.35"/><stop offset="0.5" style="stop-color:var(--wx-cloud-dark-hi)"/><stop offset="1" style="stop-color:var(--wx-cloud-dark-lo);stop-opacity:0.35"/></linearGradient>
    <linearGradient id="wxDrop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--wx-rain-hi)"/><stop offset="1" style="stop-color:var(--wx-rain-lo)"/></linearGradient>
    <linearGradient id="wxBolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3A0"/><stop offset="1" stop-color="#FF9F0A"/></linearGradient>
  </defs></svg>
  <div id="background">
    <div id="bg-gradient">
      <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
      <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div><div class="orb o5"></div>
      <div class="sweep"></div>
    </div>
    <div id="bg-photo"></div>
    <div id="bg-photo2"></div>
    <div id="bg-album"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
    <div id="bg-tod"></div>
    <div id="bg-scrim"></div>
    <div id="bg-wx"></div>
    <div id="bg-dim"></div>
  </div>

  <div id="stage">
    <div id="pager" data-page="home">
    <div id="focus-glow"></div>
    <div id="app">
      <header id="hero">
        <div id="clock-block">
          <div id="date"><span id="greeting"></span><span id="date-text"></span></div>
          <div id="clock-wrap">
            <div id="clock"><span id="clock-h">--</span><span id="clock-colon">:</span><span id="clock-m">--</span><span id="clock-s"></span><span id="clock-ampm"></span></div>
            <div id="clock-rule"></div>
          </div>
          <div id="glance"></div>
        </div>
        <div id="ornaments">
          <div id="alert-banner" class="hidden" data-focus data-detail="alerts" tabindex="0"></div>
          <button class="orn-button" id="btn-theme" data-focus aria-label="Theme">
            <span class="icon" data-icon="paintpalette"></span><span class="orn-label">Theme</span>
          </button>
          <button class="orn-button" id="btn-settings" data-focus aria-label="Settings">
            <span class="icon" data-icon="gear"></span><span class="orn-label">Settings</span>
          </button>
        </div>
      </header>

      <main id="panels">
        <section class="card" id="card-calendar" data-focus data-detail="calendar" tabindex="0">
          <div class="card-title"><span class="badge"><span class="icon" data-icon="calendar"></span></span><span class="ct-text">Up Next</span><span class="ct-sub" id="cal-sub"></span></div>
          <div id="calendar-list"></div>
          <div id="day-strip"></div>
        </section>

        <div id="right-col">
          <section class="card" id="card-weather" data-focus data-detail="weather" tabindex="0">
            <div id="weather-now"></div>
            <div id="weather-hourly" class="hourly"></div>
          </section>

          <section id="widget-area">
            <div id="widget-slots"></div>
            <div id="widget-dots"></div>
          </section>
        </div>
      </main>
      <div id="home-hint">▼ Apps</div>
    </div>

    <section id="apps" aria-label="Apps">
      <div id="apps-wash"><i></i><i></i></div>
      <div id="apps-head"><div id="apps-title">Apps</div><button id="apps-edit" class="pill" data-focus data-detail="appsedit"><span class="icon" data-icon="plus"></span>Edit</button><div id="apps-wx"></div><div id="apps-clock"></div></div>
      <div id="apps-grid"></div>
      <div id="apps-foot">▲ Back to Home</div>
      <div id="apps-toast"></div>
    </section>
    </div>

    <div id="ambient" aria-hidden="true">
      <div id="amb-body">
        <div id="amb-clock"></div>
        <div id="amb-date"></div>
        <div id="amb-line"></div>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div class="sheet" id="sheet-theme" hidden></div>
      <div class="sheet" id="sheet-settings" hidden></div>
      <div class="sheet" id="sheet-detail" hidden></div>
      <div id="sheet-hint">Press Back to close</div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="config.local.js"></script>
  <script src="spotify.local.js"></script>
  <script src="js/lib/qrcode.js"></script>
  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/location.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/smart.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/mapurl.js"></script>
  <script src="js/radarmath.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/art.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/glance.js"></script>
  <script src="js/weatherfx.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/focusglow.js"></script>
  <script src="js/depth.js"></script>
  <script src="js/pack.js"></script>
  <script src="js/widgets/registry.js"></script>
  <script src="js/widgets/sun-moon.js"></script>
  <script src="js/widgets/alerts.js"></script>
  <script src="js/widgets/wifi.js"></script>
  <script src="js/widgets/dates.js"></script>
  <script src="js/widgets/commute.js"></script>
  <script src="js/widgets/nasa.js"></script>
  <script src="js/widgets/air.js"></script>
  <script src="js/widgets/radar.js"></script>
  <script src="js/widgets/countdown.js"></script>
  <script src="js/widgets/spotify.js"></script>
  <script src="js/appmatch.js"></script>
  <script src="js/logos.js"></script>
  <script src="js/pager.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
